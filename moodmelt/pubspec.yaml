name: moodmelt
description: Your emotional wellness companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Health Integration
  health: ^10.2.0
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Animations
  rive: ^0.13.12
  lottie: ^3.1.2

  # Audio
  just_audio: ^0.9.40
  flutter_tts: ^4.0.2

  # Firebase (optional for now)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # UI & Utils
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/sounds/
    - assets/images/
